<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A 43-second look at RealStack: Mortgage Blueprint for clients, RealStack Ops for the loan officer." />
    <meta name="theme-color" content="#0a1120" />
    <meta property="og:title" content="RealStack in 43 seconds" />
    <meta property="og:description" content="Mortgage Blueprint for clients, RealStack Ops for the loan officer." />
    <meta property="og:type" content="video.other" />
    <meta property="og:url" content="https://www.realstack.app/demo" />
    <meta property="og:image" content="https://www.realstack.app/demo/poster.jpg" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="606" />
    <meta property="og:video" content="https://www.realstack.app/demo/realstack-demo.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RealStack in 43 seconds" />
    <meta name="twitter:image" content="https://www.realstack.app/demo/poster.jpg" />
    <link rel="canonical" href="https://www.realstack.app/demo" />
    <title>RealStack Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <!-- Standalone page (not part of the React bundle) so /demo works as a
         plain static file. Tokens mirror src/App.css :root. -->
    <style>
      :root {
        --bg-base: #0a1120;
        --accent: #3B6BF5;
        --accent-light: #6E90FF;
        --accent-deep: #2B4FCE;
        --text-primary: #EDEDED;
        --text-secondary: #A1A1A1;
        --text-muted: #8A8A8A;
        --border: rgba(255,255,255,0.08);
        --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --mono: 'Geist Mono', 'SF Mono', monospace;
      }
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: var(--font); color: var(--text-primary); line-height: 1.6;
        background: radial-gradient(1200px 600px at 50% -10%, rgba(59,107,245,0.22), transparent 70%), var(--bg-base);
        min-height: 100vh; -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column;
      }
      a { color: inherit; text-decoration: none; }
      header { max-width: 1100px; width: 100%; margin: 0 auto; padding: 24px 16px; }
      .logo { font-weight: 800; font-size: 1.25rem; letter-spacing: -0.04em; }
      .logo span { color: var(--accent-light); }
      main { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 24px 16px 64px; text-align: center; }
      .overline {
        font-family: var(--mono); font-size: 0.7rem; font-weight: 600;
        letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-light);
      }
      h1 { font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.1; letter-spacing: -0.04em; margin: 12px 0 12px; }
      .sub { color: var(--text-secondary); font-size: 1.05rem; max-width: 560px; margin: 0 auto 36px; }
      .player {
        border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
        box-shadow: 0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(59,107,245,0.15);
        background: #000; aspect-ratio: 1080 / 606;
      }
      video { display: block; width: 100%; height: 100%; }
      .cta {
        display: inline-block; margin-top: 36px; padding: 12px 28px; border-radius: 9999px;
        background: linear-gradient(135deg, var(--accent), var(--accent-deep));
        color: #fff; font-weight: 600; font-size: 0.95rem;
      }
      .cta:hover { filter: brightness(1.1); }
      footer { padding: 24px 16px; text-align: center; color: var(--text-muted); font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <header>
      <a class="logo" href="/">Real<span>Stack</span></a>
    </header>
    <main>
      <p class="overline">Product demo</p>
      <h1>RealStack in 43 seconds</h1>
      <p class="sub">Mortgage Blueprint for your clients, RealStack Ops for you. One stack from first scenario to funded loan.</p>
      <div class="player">
        <video src="/demo/realstack-demo.mp4" poster="/demo/poster.jpg" controls playsinline preload="metadata"></video>
      </div>
      <a class="cta" href="/">Visit realstack.app</a>
    </main>
    <footer>RealStack · Built by Chris Granger, NMLS 952015</footer>
  </body>
</html>
